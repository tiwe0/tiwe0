name: Waka Readme

on:
  # for manual workflow trigger
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/waka-readme.yml"
  schedule:
    # runs at 12 AM UTC (5:30 AM IST)
    - cron: "0 0 * * *"

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          # Note: WakaTime API keys (waka_...) are now write-only.
          # Set WAKATIME_API_KEY in repo secrets to a Personal OAuth Token from https://wakatime.com/oauth
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
